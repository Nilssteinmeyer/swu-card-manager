# Star Wars Unlimited Card Manager — Configuration
# All paths are relative to the project root unless absolute.

app:
  name: "Star Wars Unlimited Card Manager"
  version: "1.0.0"

paths:
  database: "data/cards.db"
  images_dir: "data/images"
  dataset_dir: "data/dataset"
  models_dir: "data/models"
  backup_dir: "project_state/backups"
  recovery_dir: "project_state/recovery"
  logs_dir: "logs"

database:
  type: "sqlite"
  journal_mode: "WAL"
  backup_count: 5
  integrity_check_interval_hours: 6

camera:
  # 0 = default webcam; -1 = no auto-detect (use IP camera)
  device_index: 0
  # IP camera URL (if using smartphone). Empty = use local webcam.
  ip_camera_url: ""
  width: 1920
  height: 1080
  capture_interval_ms: 500

ocr:
  tesseract_path: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  tessdata_dir: "tessdata"
  # OCR both languages simultaneously
  language: "deu+eng"
  min_confidence: 40

recognition:
  # Minimum confidence to auto-accept a recognition result (0-1)
  # Lowered from 0.85 to 0.70 for real camera photos which have lower phash scores
  auto_accept_threshold: 0.70
  # Minimum confidence to show candidates (0-1)
  # Lowered from 0.50 to 0.25 so real camera photos still get candidates
  candidate_threshold: 0.25
  # Weights for each signal (must sum to ~1.0)
  weights:
    ocr: 0.40
    perceptual_hash: 0.25
    feature_match: 0.25
    metadata: 0.10

data_provider:
  # Primary: swu-db.com public API
  provider: "swudb"
  base_url: "https://api.swu-db.com"
  image_base_url: "https://cdn.swu-db.com"
  # Rate limiting: seconds between requests
  request_delay: 0.5
  max_retries: 3
  timeout: 30
  # Download images during import
  download_images: true

update:
  # Check for new sets every N hours
  check_interval_hours: 24
  # Auto-import new sets when found
  auto_import: true

training:
  enabled: false
  min_samples_per_card: 5
  min_total_samples: 50
  improvement_threshold: 0.03
  max_models_kept: 10

logging:
  level: "INFO"
  file_max_bytes: 5242880
  file_backup_count: 5

backup:
  enabled: true
  interval_hours: 24
  max_backups: 10

network:
  port: 8765

gui:
  theme: "dark"
  window_width: 1400
  window_height: 900
