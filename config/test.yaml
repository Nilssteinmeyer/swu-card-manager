# ============================================================================
# SWU Card Manager — MEINE SAMMLUNG (SWU_ENV=test) — lokale Haupt-App
# ----------------------------------------------------------------------------
# Das ist DIE App fuer den Alltag: DEINE Daten (data/cards.db mit allen
# Karten, Usern, Sammlungen) + GPU-Scanner (RTX A2000), im Heimnetz auf
# dem gewohnten Port 8765 (iPhone: https://192.168.178.74:8765).
# Der Name "test" ist historisch (SWU_ENV=test war der Default) - hier
# laeuft die persoenliche Produktiv-Instanz mit Scan-Unterstuetzung.
# ============================================================================

paths:
  database: "data/cards.db"
  images_dir: "data/images"
  dataset_dir: "data/dataset"
  models_dir: "data/models"
  backup_dir: "project_state/backups"
  recovery_dir: "project_state/recovery"
  logs_dir: "logs"

server:
  deployment_mode: "local"
  app_host: "0.0.0.0"
  app_port: 8765
  public_url: "https://192.168.178.74:8765"
  # Scanner AKTIV - das ist der GPU-Host mit der persoenlichen Sammlung
  scan_enabled: true

backup:
  schedule_time: "03:30"
  target_dir: "C:/SWU-ServerBackups/main"
  target_dir_fallback: "project_state/backups/daily"
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6
  restore_drill_weekday: 0
  email_on_failure: false
