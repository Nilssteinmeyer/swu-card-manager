# ============================================================================
# SWU Card Manager — PRODUKTIV-UMGEBUNG (SWU_ENV=prod)
# ----------------------------------------------------------------------------
# Wird von app/core/config.py als Overlay ueber config.yaml gemischt.
# Prod-Instanz: laeuft hinter Caddy (127.0.0.1:8443), Scanner deaktiviert
# (503), eigene DB unter data/ (Produktivdaten). NEUE USER bekommen eigene
# Haushalte/Sammlungen (Haushalt-Trennung, bereits implementiert).
# ============================================================================

paths:
  database: "data/cards.db"
  images_dir: "data/images"
  dataset_dir: "data/dataset"
  models_dir: "data/models"
  backup_dir: "project_state/backups"
  recovery_dir: "project_state/recovery"
  logs_dir: "logs"

server:
  deployment_mode: "internet"
  app_host: "127.0.0.1"
  app_port: 8443
  public_url: "https://swu-cardscanner.duckdns.org"
  # Scanner ist GPU-gebunden -> nur Test-Instanz; Prod antwortet 503
  scan_enabled: false

backup:
  schedule_time: "03:00"
  # Ziel 1: lokale Zweit-Struktur; Ziel 2 (3-2-1): USB-Stick D:
  target_dir: "C:/SWU-ServerBackups/prod"
  target_dir_external: "D:/SWU-Backups"
  target_dir_fallback: "project_state/backups/daily"
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6
  restore_drill_weekday: 0
  email_on_failure: true
