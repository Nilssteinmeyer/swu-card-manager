<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Einstellungen — SWU Card Manager</title>
  <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
  <div class="app-shell">
    <nav class="navbar">
      <div class="navbar-brand"><span class="logo">🃏</span><span>SWU Manager</span></div>
            <ul class="navbar-nav">
        <li><a href="/"><span class="icon">📊</span><span class="label">Dashboard</span></a></li>
        <li><a href="/scanner"><span class="icon">📷</span><span class="label">Scanner</span></a></li>
        <li><a href="/collection"><span class="icon">🗂️</span><span class="label">Sammlung</span></a></li>
        <li><a href="/sets"><span class="icon">📦</span><span class="label">Sets</span></a></li>
        <li><a href="/settings"><span class="icon">⚙️</span><span class="label">Einstellungen</span></a></li>
        <li><a href="/system"><span class="icon">🔧</span><span class="label">System</span></a></li>
      </ul>
    </nav>

    <main class="main-content">
      <h1 class="mb-2">⚙️ Einstellungen</h1>

      <!-- Scan-Prozess -->
      <div class="settings-section">
        <h2 class="settings-title">📷 Scan-Prozess</h2>

        <div class="setting-row">
          <label>Automatisches Scannen</label>
          <label class="switch"><input type="checkbox" id="auto_scan"><span class="slider"></span></label>
        </div>

        <div class="setting-row">
          <label>Scan-Intervall (ms)</label>
          <input type="number" id="scan_interval_ms" class="setting-input" min="200" max="5000" step="100">
        </div>

        <div class="setting-row">
          <label>Kamera einfrieren während Scan</label>
          <label class="switch"><input type="checkbox" id="freeze_camera_during_scan"><span class="slider"></span></label>
        </div>

        <div class="setting-row">
          <label>Stabilisierungs-Verzögerung (ms)</label>
          <input type="number" id="stabilization_delay_ms" class="setting-input" min="0" max="5000" step="100">
        </div>

        <div class="setting-row">
          <label>Auflösung der Aufnahme (px Breite)</label>
          <select id="capture_resolution" class="setting-select">
            <option value="640">640px (schnell)</option>
            <option value="800">800px</option>
            <option value="1200">1200px (empfohlen)</option>
            <option value="1920">1920px (HD)</option>
          </select>
        </div>

        <div class="setting-row">
          <label>JPEG-Qualität</label>
          <input type="range" id="jpeg_quality" min="50" max="100" step="5" class="setting-range">
          <span id="jpeg_quality_val" class="range-val">90</span>
        </div>

        <div class="setting-row">
          <label>Kamera</label>
          <select id="camera_facing" class="setting-select">
            <option value="environment">Rückkamera</option>
            <option value="user">Frontkamera</option>
          </select>
        </div>
      </div>

      <!-- Erkennung -->
      <div class="settings-section">
        <h2 class="settings-title">🎯 Erkennung</h2>

        <div class="setting-row">
          <label>Auto-Accept Schwelle (%)</label>
          <input type="range" id="auto_accept_threshold" min="50" max="95" step="5" class="setting-range">
          <span id="auto_accept_val" class="range-val">70</span>
        </div>

        <div class="setting-row">
          <label>Kandidaten-Schwelle (%)</label>
          <input type="range" id="candidate_threshold" min="5" max="50" step="5" class="setting-range">
          <span id="candidate_threshold_val" class="range-val">25</span>
        </div>

        <div class="setting-row">
          <label>Max. Kandidaten anzeigen</label>
          <input type="number" id="max_candidates" class="setting-input" min="1" max="10">
        </div>

        <div class="setting-row">
          <label>Konfidenz-Balken anzeigen</label>
          <label class="switch"><input type="checkbox" id="show_confidence_bar"><span class="slider"></span></label>
        </div>

        <div class="setting-row">
          <label>Verarbeitungszeit anzeigen</label>
          <label class="switch"><input type="checkbox" id="show_processing_time"><span class="slider"></span></label>
        </div>
      </div>

      <!-- Feedback -->
      <div class="settings-section">
        <h2 class="settings-title">📳 Haptisches Feedback</h2>

        <div class="setting-row">
          <label>Vibration bei Scan-Erkennung</label>
          <label class="switch"><input type="checkbox" id="haptic_on_scan"><span class="slider"></span></label>
        </div>

        <div class="setting-row">
          <label>Vibration bei Bestätigung</label>
          <label class="switch"><input type="checkbox" id="haptic_on_confirm"><span class="slider"></span></label>
        </div>

        <div class="setting-row">
          <label>Vibration bei Ablehnung</label>
          <label class="switch"><input type="checkbox" id="haptic_on_reject"><span class="slider"></span></label>
        </div>

        <div class="setting-row">
          <label>Vibrationsmuster (Bestätigung)</label>
          <input type="text" id="haptic_pattern_confirm" class="setting-input" placeholder="50,30,80">
        </div>
      </div>

      <!-- UI -->
      <div class="settings-section">
        <h2 class="settings-title">🎨 Oberfläche</h2>

        <div class="setting-row">
          <label>Kartenbild-Größe (vw)</label>
          <input type="range" id="card_image_size" min="25" max="60" step="5" class="setting-range">
          <span id="card_image_size_val" class="range-val">40</span>
        </div>

        <div class="setting-row">
          <label>Sprache</label>
          <select id="language" class="setting-select">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>

      <!-- Save / Reset -->
      <div class="settings-actions">
        <button class="btn btn-success btn-large" id="btn-save-settings">💾 Speichern</button>
        <button class="btn btn-secondary btn-large" id="btn-reset-settings">↺ Zurücksetzen</button>
      </div>
    </main>
  </div>

  <script src="/static/common.js"></script>
  <script>
    async function loadSettings() {
      const data = await api("/api/settings");
      Object.keys(data).forEach(key => {
        const el = document.getElementById(key);
        if (!el) return;
        if (el.type === "checkbox") el.checked = data[key] === "true";
        else el.value = data[key];
      });
      // Update range labels
      updateRangeLabels();
    }

    function updateRangeLabels() {
      ["jpeg_quality", "auto_accept_threshold", "candidate_threshold", "card_image_size"].forEach(id => {
        const el = document.getElementById(id);
        const valEl = document.getElementById(id + "_val");
        if (el && valEl) {
          if (id === "auto_accept_threshold" || id === "candidate_threshold") {
            valEl.textContent = (parseFloat(el.value)).toFixed(0);
          } else {
            valEl.textContent = el.value;
          }
        }
      });
    }

    // Range listeners
    document.querySelectorAll('.setting-range').forEach(el => {
      el.addEventListener('input', updateRangeLabels);
    });

    async function saveSettings() {
      const settings = {};
      document.querySelectorAll('input, select').forEach(el => {
        if (!el.id) return;
        if (el.type === "checkbox") settings[el.id] = el.checked ? "true" : "false";
        else settings[el.id] = el.value;
      });
      await api("/api/settings", { method: "POST", body: settings });
      showToast("Einstellungen gespeichert ✓", "success");
    }

    async function resetSettings() {
      await api("/api/settings/reset", { method: "POST" });
      await loadSettings();
      showToast("Einstellungen zurückgesetzt", "info");
    }

    document.getElementById("btn-save-settings").addEventListener("click", saveSettings);
    document.getElementById("btn-reset-settings").addEventListener("click", resetSettings);
    loadSettings();
  </script>
</body>
</html>
