{% extends "base_app.html" %}
{% block title %}Scanner{% endblock %}

{% block content %}
      <h1 class="mb-2">Scanner</h1>

      <!-- Bulk session counter (visible in bulk mode) -->
      <div id="bulk-session-counter" class="card hidden" style="padding:10px 16px; font-size:14px;">
        ⏳ Noch keine Karte in dieser Session...
      </div>

      <!-- Undo last scan action -->
      <div id="undo-bar" class="hidden" style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <button class="btn btn-secondary" id="btn-undo-last" onclick="undoLastScan()" title="Letzte Aktion rückgängig machen">
          ↩️ Letzten Scan rückgängig machen
        </button>
        <span class="text-muted" id="undo-info" style="font-size:13px;"></span>
      </div>

      <!-- Scan-Modus: Sammlung oder Preis -->
      <div class="scan-mode-switch" id="scan-mode-switch">
        <span class="scan-mode-label">Modus:</span>
        <div class="scan-mode-seg" role="tablist" aria-label="Scan-Modus">
          <button type="button" class="scan-mode-btn active" id="mode-btn-collection"
                  onclick="setScanMode('collection')" role="tab" aria-selected="true">
            📦 <span>Sammlung</span>
          </button>
          <button type="button" class="scan-mode-btn" id="mode-btn-price"
                  onclick="setScanMode('price')" role="tab" aria-selected="false">
            💰 <span>Preis</span>
          </button>
        </div>
      </div>

      <div class="scanner-container">
        <!-- Camera -->
        <div class="camera-wrap" id="camera-wrap">
          <video id="camera-video" autoplay playsinline muted></video>
          <div class="camera-hud" id="camera-hud" aria-hidden="true">
            <img src="/static/assets/scanner_hud.svg" alt="">
          </div>
          <div class="camera-overlay">
            <div class="frame" id="scan-frame"></div>
          </div>
          <!-- Scan status overlay on camera -->
          <div id="scan-overlay" class="scan-overlay">
            <div id="scan-overlay-icon" class="scan-overlay-icon">📷</div>
            <div id="scan-overlay-text" class="scan-overlay-text">Kamera gestoppt</div>
          </div>

          <!-- Camera controls (iOS-like): zoom slider + torch -->
          <div id="camera-controls" class="camera-controls hidden">
            <button class="cam-btn" id="btn-torch" title="Blitz an/aus">🔦</button>
            <div class="zoom-track" id="zoom-track">
              <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="1" title="Zoom">
              <div class="zoom-presets" id="zoom-presets">
                <button class="zoom-preset" data-zoom="1">1×</button>
                <button class="zoom-preset" data-zoom="2">2×</button>
                <button class="zoom-preset" data-zoom="4" id="zoom-preset-4">4×</button>
              </div>
            </div>
            <div class="zoom-badge" id="zoom-badge">1×</div>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex gap-1" style="flex-wrap:wrap;">
          <button id="start-camera-btn" class="btn btn-primary">📷 Kamera starten</button>
          <button id="stop-camera-btn" class="btn btn-danger hidden">⏹ Stop</button>
          <button id="manual-scan-btn" class="btn btn-success btn-large hidden" style="min-width:170px; min-height:54px; font-size:17px;">🔍 Jetzt scannen</button>
        </div>

        <!-- Scan result — full-screen mobile popup -->
        <div id="scan-result-overlay" class="scan-result-overlay" style="display:none;">
          <div class="scan-result-card">
            <div class="scan-result-image" id="result-image-area">🃏</div>
            <div class="scan-result-info">
              <div class="lang-toggle" id="scan-lang-toggle" title="Sprache der Karte">
                <button type="button" class="lang-btn" id="lang-btn-de" onclick="setScanLanguage('de')">🇩🇪</button>
                <button type="button" class="lang-btn" id="lang-btn-en" onclick="setScanLanguage('en')">🇬🇧</button>
              </div>
              <div class="scan-result-name" id="result-name">—</div>
              <div class="scan-result-sub" id="result-sub"></div>
              <div class="scan-result-meta" id="result-meta"></div>
              <div class="scan-result-confidence" id="result-confidence"></div>
              <div class="scan-price-info hidden" id="scan-price-info"></div>
              <div class="price-foil-toggle hidden" id="price-foil-toggle" style="margin-top:8px; display:flex; align-items:center; gap:6px; font-size:13px;">
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                  <input type="checkbox" id="price-foil-checkbox" onchange="loadPriceForCard((lastScanResult?.candidates?.[0] || {}).card_id, this.checked)">
                  ✨ Foil-Preis anzeigen
                </label>
              </div>
            </div>
            <div class="scan-result-foil">
              <div class="quantity-control">
                <button class="btn btn-qty" id="btn-qty-minus">−</button>
                <span class="qty-display" id="qty-display">1</span>
                <button class="btn btn-qty" id="btn-qty-plus">+</button>
              </div>
              <label><input type="checkbox" id="is-foil-checkbox"> Foil-Version</label>
            </div>
            <div class="scan-result-actions">
              <button class="btn btn-success btn-large" id="btn-confirm">✓ Ja, richtige Karte</button>
              <button class="btn btn-success btn-large hidden" id="btn-price-ok">💰 Preis ansehen</button>
              <button class="btn btn-danger btn-large" id="btn-reject">✗ Nein, falsche Karte</button>
              <button class="btn btn-secondary btn-large" id="btn-cancel">↩ Abbrechen</button>
            </div>
          </div>
          <!-- Alternative candidates -->
          <div id="candidate-list" class="candidate-list-overlay"></div>
        </div>

        <!-- Candidate list (inline, when no overlay) -->
        <div id="candidate-list-inline" class="candidate-list"></div>
      </div>
{% endblock %}

{% block scripts %}
  <script src="/static/scanner.js?v=16"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js?v=33').then(reg => {
              // Sofort pruefen ob ein neuer SW existiert
              reg.update().catch(() => {});
            }).catch(() => {});
      });
    }
  </script>
{% endblock %}
