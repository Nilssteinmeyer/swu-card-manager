<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- SWU Card Manager — Login-Hero: Deep Space + Sterne + gelber Akzent -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#1a2540" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0d1420" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe81f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffe81f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dd8ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4dd8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="1920" height="1080" fill="#0a0e14"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Sterne (deterministisch gesetzt) -->
  <g fill="#e8ecf4">
    <circle cx="120" cy="90" r="1.6" opacity="0.9"/><circle cx="380" cy="210" r="1.1" opacity="0.5"/>
    <circle cx="640" cy="60" r="1.8" opacity="0.8"/><circle cx="910" cy="160" r="1.2" opacity="0.6"/>
    <circle cx="1180" cy="90" r="1.5" opacity="0.85"/><circle cx="1450" cy="230" r="1.0" opacity="0.4"/>
    <circle cx="1720" cy="120" r="1.7" opacity="0.75"/><circle cx="210" cy="420" r="1.3" opacity="0.6"/>
    <circle cx="530" cy="330" r="1.6" opacity="0.7"/><circle cx="860" cy="280" r="1.1" opacity="0.45"/>
    <circle cx="1240" cy="350" r="1.9" opacity="0.85"/><circle cx="1600" cy="300" r="1.4" opacity="0.6"/>
    <circle cx="90" cy="640" r="1.5" opacity="0.7"/><circle cx="420" cy="560" r="1.1" opacity="0.5"/>
    <circle cx="760" cy="610" r="1.7" opacity="0.8"/><circle cx="1090" cy="520" r="1.2" opacity="0.55"/>
    <circle cx="1420" cy="600" r="1.6" opacity="0.7"/><circle cx="1780" cy="540" r="1.3" opacity="0.6"/>
    <circle cx="260" cy="880" r="1.4" opacity="0.65"/><circle cx="620" cy="920" r="1.8" opacity="0.8"/>
    <circle cx="980" cy="840" r="1.1" opacity="0.5"/><circle cx="1340" cy="900" r="1.5" opacity="0.7"/>
    <circle cx="1680" cy="820" r="1.2" opacity="0.55"/>
  </g>
  <!-- Größere Akzent-Sterne mit Glanz -->
  <g>
    <circle cx="1500" cy="150" r="16" fill="url(#yellowGlow)"/>
    <circle cx="1500" cy="150" r="2.4" fill="#ffe81f" opacity="0.95"/>
    <circle cx="300" cy="300" r="20" fill="url(#cyanGlow)"/>
    <circle cx="300" cy="300" r="2.0" fill="#4dd8ff" opacity="0.9"/>
  </g>

  <!-- Sichthorizont / Planeten-Silhouette unten -->
  <path d="M0,980 C320,920 620,1010 940,960 C1260,910 1560,1000 1920,940 L1920,1080 L0,1080 Z"
        fill="#10151f" opacity="0.9"/>
  <path d="M0,1020 C380,970 720,1050 1100,1005 C1440,965 1700,1040 1920,1000 L1920,1080 L0,1080 Z"
        fill="#161d2b"/>

  <!-- Lichtschwert-Silhouette (subtil, unten rechts) -->
  <g transform="translate(1560,530) rotate(24)" opacity="0.85">
    <rect x="-5" y="0" width="10" height="330" rx="5" fill="url(#yellowGlow)"/>
    <rect x="-2.2" y="0" width="4.4" height="330" rx="2.2" fill="#ffe81f" opacity="0.75"/>
    <rect x="-9" y="330" width="18" height="26" rx="4" fill="#2a3446"/>
    <rect x="-6" y="356" width="12" height="46" rx="3" fill="#1c2536"/>
  </g>

  <!-- Karten-Silhouetten schwebend (unten links, dezente Karten) -->
  <g transform="translate(180,700)" opacity="0.55">
    <rect x="0" y="0" width="150" height="210" rx="10" fill="#161d2b" stroke="#2a3446" transform="rotate(-14)"/>
    <rect x="40" y="18" width="150" height="210" rx="10" fill="#1c2536" stroke="#2a3446" transform="rotate(6)"/>
    <circle cx="115" cy="120" r="26" fill="none" stroke="#ffe81f" stroke-width="2.5" opacity="0.8" transform="rotate(6 40 18)"/>
  </g>
</svg>
