<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- SWU Empty State: Droid mit Antennen-Geste (Fehler/Offline) -->
  <defs>
    <radialGradient id="errGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ff5a52" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff5a52" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="112" r="100" fill="url(#errGlow)"/>

  <!-- Droid mit hängender Antenne -->
  <g>
    <circle cx="120" cy="96" r="38" fill="#161d2b" stroke="#2a3446" stroke-width="5"/>
    <circle cx="120" cy="96" r="13" fill="#0a0e14" stroke="#ff5a52" stroke-width="3.5"/>
    <circle cx="120" cy="96" r="5" fill="#ff5a52"/>
    <!-- Antenne gebrochen/hängend -->
    <path d="M148,72 C160,60 166,66 162,78" fill="none" stroke="#2a3446" stroke-width="5" stroke-linecap="round"/>
    <circle cx="162" cy="80" r="4" fill="#2a3446"/>
    <rect x="106" y="132" width="28" height="12" fill="#1c2536" stroke="#2a3446" stroke-width="3"/>
    <rect x="98" y="142" width="44" height="26" rx="8" fill="#161d2b" stroke="#2a3446" stroke-width="5"/>
    <circle cx="110" cy="155" r="3" fill="#9aa4b2" opacity="0.6"/>
    <circle cx="130" cy="155" r="3" fill="#9aa4b2" opacity="0.6"/>
  </g>

  <!-- Funkwellen gestoppt -->
  <g fill="none" stroke="#ff5a52" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M84,52 L92,44 M92,52 L84,44"/>
    <circle cx="150" cy="130" r="9" opacity="0.0"/>
  </g>
  <g stroke="#ff5a52" stroke-width="3.5" stroke-linecap="round">
    <path d="M148,124 L166,142 M166,124 L148,142"/>
  </g>
</svg>
